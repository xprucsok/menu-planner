    /* SEGÉDFÜGGVÉNYEK */

    function getDateKey(date) {

      const year =
        date.getFullYear();

      const month =
        String(
          date.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          date.getDate()
        ).padStart(2, "0");


      return (
        year +
        "-" +
        month +
        "-" +
        day
      );

    }


    function parseMultiValue(value) {

      if (Array.isArray(value)) {

        return value
          .map(item => String(item).trim())
          .filter(Boolean);

      }


      if (!value) {
        return [];
      }


      return String(value)
        .split(/[;,]/)
        .map(item => item.trim())
        .filter(Boolean);

    }


    function uniqueSorted(values) {

      return Array.from(
        new Set(
          values.filter(Boolean)
        )
      ).sort(
        (a, b) =>
          a.localeCompare(
            b,
            "hu"
          )
      );

    }


    function normalizeText(value) {

      return String(
        value || ""
      ).toLocaleLowerCase("hu");

    }


    function formatDateKey(dateKey) {

      if (!dateKey) {
        return "";
      }


      const parts =
        dateKey.split("-");

      if (parts.length !== 3) {
        return dateKey;
      }


      const date =
        new Date(
          Number(parts[0]),
          Number(parts[1]) - 1,
          Number(parts[2])
        );


      return date.toLocaleDateString(
        "hu-HU",
        {
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );

    }


    function getLastEatenDate(foodId) {

      let latest = null;


      for (
        const dateKey
        in savedMenu
      ) {

        const item =
          savedMenu[dateKey];


        if (
          item.foodId === foodId
        ) {

          if (
            latest === null ||
            dateKey > latest
          ) {

            latest =
              dateKey;

          }

        }

      }


      return latest;

    }


    function getLastEatenText(foodId) {

      const dateKey =
        getLastEatenDate(foodId);


      if (!dateKey) {

        return "Még nincs korábbi menüben.";

      }


      return (
        "Utoljára: " +
        formatDateKey(dateKey)
      );

    }


    function collectTypeOptions() {

      const values = [];


      for (const food of allFoods) {

        values.push(
          ...parseMultiValue(
            food.types

        );

      }


      values.push(
        ...selectedTypes
      );


      return uniqueSorted(values);

    }


    function collectApplicabilityOptions() {

      const values = [];


      for (const food of allFoods) {

        values.push(
          ...parseMultiValue(
            food.applicability

      }


      values.push(
        ...selectedApplicabilities
      );


      return uniqueSorted(values);

    }


    function collectTagOptions() {

      const values = [
        ...baseTags

      for (const food of allFoods) {

        values.push(
          ...parseMultiValue(
            food.tags
          )
        );

      }


      values.push(
        ...selectedTags
      );


      return uniqueSorted(values);

    }

        await getDocs(
          collection(
            db,
            "menu"
          )
        );


      snapshot.forEach(
        menuDocument => {

          savedMenu[
            menuDocument.id
          ] = {
            id:
              menuDocument.id,

            ...menuDocument.data()
          };

        }
      );

    }


    /* ÉTELEK BETÖLTÉSE */

    async function loadFoods() {

      loadingFoods.classList.remove(
        "hidden"
      );

      foodError.classList.add(
        "hidden"
      );


      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "foods"
            )
          );


        const foods = [];


        snapshot.forEach(
          foodDocument => {

            const data =
              foodDocument.data();


            foods.push({
              id:
                foodDocument.id,

              ...data,

              types:
                parseMultiValue(
                  data.types
                ),

              tags:
                parseMultiValue(
                  data.tags
                )
            });

          }
        );


        foods.sort(
          (a, b) =>
            (a.name || "")
              .localeCompare(
                b.name || "",
                "hu"
              )
        );


        allFoods =
          foods;


        availableFoods =
          allFoods.filter(
            food =>
              food.active !== false
          );


        loadingFoods.classList.add(
          "hidden"
        );


        renderFoodList();


      } catch (error) {

        console.error(error);


        loadingFoods.classList.add(
          "hidden"
        );


        foodError.textContent =
          "Az ételek betöltése nem sikerült: " +
          error.message;


        foodError.classList.remove(
          "hidden"
        );

      }

    }


    /* ÉTELEK OLDAL */

    function foodMatchesSearch(
      food,
      searchText
    ) {

      if (!searchText) {
        return true;
      }


      const searchable =
        [
          food.name,
          food.ingredients,
          ...parseMultiValue(
            food.types
          ),
          ...parseMultiValue(
            food.applicability
          ),
          ...parseMultiValue(
            food.tags
          )
        ]
        .join(" ")
        .toLocaleLowerCase("hu");


      return searchable.includes(
        searchText
      );

    }


    function renderFoodList() {

      foodList.innerHTML = "";


      const searchText =
        normalizeText(
          foodSearch.value
        ).trim();


      const filtered =
        allFoods.filter(
          food =>
            foodMatchesSearch(
              food,
              searchText
            )
        );


      const activeCount =
        allFoods.filter(
          food =>
            food.active !== false
        ).length;


      foodCount.textContent =
        activeCount +
        " aktív étel";


      if (filtered.length === 0) {

        const empty =
          document.createElement("div");

        empty.className =
          "emptyMessage";

        empty.textContent =
          "Nincs találat.";

        foodList.appendChild(
          empty
        );

        return;

      }


      for (const food of filtered) {

        const card =
          document.createElement("div");

        card.className =
          "foodCard";


        if (food.active === false) {

          card.classList.add(
            "inactive"
          );

        }


        const name =
          document.createElement("div");

        name.className =
          "foodName";

        name.textContent =
          food.name ||
          "Névtelen étel";


        card.appendChild(name);


        const meta =
          document.createElement("div");

        meta.className =
          "foodMeta";


        const metaParts = [];


        const types =
          parseMultiValue(
            food.types
          );


        if (types.length > 0) {

          metaParts.push(
            types.join(", ")
          );

        }


        const applicability =
          parseMultiValue(
            food.applicability
          );


        if (
          applicability.length > 0
        ) {

          metaParts.push(
            applicability.join(", ")
          );

        }


        if (food.active === false) {

          metaParts.push(
            "Inaktív"
          );

        }


        meta.textContent =
          metaParts.join(" • ");


        card.appendChild(meta);


        const lastEaten =
          document.createElement("div");

        lastEaten.className =
          "lastEaten";

        lastEaten.textContent =
          getLastEatenText(
            food.id
          );


        card.appendChild(
          lastEaten
        );


        const foodTags =
          parseMultiValue(
            food.tags
          );


        if (foodTags.length > 0) {

          const tags =
            document.createElement("div");

          tags.className =
            "tags";


          for (
            const tagText
            of foodTags
          ) {

            const tag =
              document.createElement(
                "span"
              );

            tag.className =
              "tag";

            tag.textContent =
              tagText;


            tags.appendChild(
              tag
            );

          }


          card.appendChild(
            tags
          );

        }


        if (food.ingredients) {

          const ingredients =
            document.createElement("div");

          ingredients.className =
            "ingredients";

          ingredients.textContent =
            food.ingredients;


          card.appendChild(
            ingredients
          );

        }


        card.addEventListener(
          "click",
          () => {

            openFoodForm(
              food
            );

          }
        );


        foodList.appendChild(
          card
        );

      }

    }


    foodSearch.addEventListener(
      "input",
      renderFoodList
    );


    /* MENÜ */

    function createMenu() {

      menuWeeks.innerHTML = "";


      const today =
        new Date();

      today.setHours(
        0,
        0,
        0,
        0
      );


      const currentMonday =
        new Date(today);


      const dayOfWeek =
        today.getDay();


      const daysSinceMonday =
        dayOfWeek === 0
          ? 6
          : dayOfWeek - 1;


      currentMonday.setDate(
        today.getDate() -
        daysSinceMonday
      );


      for (
        let week = 0;
        week < 3;
        week++
      ) {

        const weekStart =
          new Date(currentMonday);


        weekStart.setDate(
          currentMonday.getDate() +
          week * 7
        );


        const weekEnd =
          new Date(weekStart);


        weekEnd.setDate(
          weekStart.getDate() + 6
        );


        const weekElement =
          document.createElement("div");

        weekElement.className =
          "menuWeek";


        const title =
          document.createElement("div");

        title.className =
          "weekTitle";


        const startText =
          weekStart.toLocaleDateString(
            "hu-HU",
            {
              month: "short",
              day: "numeric"
            }
          );


        const endText =
          weekEnd.toLocaleDateString(
            "hu-HU",
            {
              month: "short",
              day: "numeric"
            }
          );


        if (week === 0) {

          title.textContent =
            "Ezen a héten · " +
            startText +
            " – " +
            endText;

        } else if (week === 1) {

          title.textContent =
            "Jövő héten · " +
            startText +
            " – " +
            endText;

        } else {

          title.textContent =
            startText +
            " – " +
            endText;

        }


        weekElement.appendChild(
          title
        );


        for (
          let day = 0;
          day < 7;
          day++
        ) {

          const date =
            new Date(weekStart);


          date.setDate(
            weekStart.getDate() +
            day
          );


          const dateKey =
            getDateKey(date);


          const dayCard =
            document.createElement("div");

          dayCard.className =
            "dayCard";


          const dayInfo =
            document.createElement("div");

          dayInfo.className =
            "dayInfo";


          const dayName =
            document.createElement("div");

          dayName.className =
            "dayName";

          dayName.textContent =
            dayNames[day];


          const dayDate =
            document.createElement("div");

          dayDate.className =
            "dayDate";

          dayDate.textContent =
            date.toLocaleDateString(
              "hu-HU",
              {
                month: "short",
                day: "numeric"
              }
            );


          dayInfo.appendChild(
            dayName
          );

          dayInfo.appendChild(
            dayDate
          );


          const dayFood =
            document.createElement("div");

          dayFood.className =
            "dayFood";


          if (
            savedMenu[dateKey] &&
            savedMenu[dateKey].foodName
          ) {

            dayFood.textContent =
              savedMenu[
                dateKey
              ].foodName;

            dayFood.classList.add(
              "planned"
            );

          } else {

            dayFood.textContent =
              "Nincs tervezve";

          }


          if (
            date.getTime() ===
            today.getTime()
          ) {

            dayCard.classList.add(
              "today"
            );

            dayName.textContent =
              dayNames[day] +
              " · MA";

          }


          dayCard.appendChild(
            dayInfo
          );

          dayCard.appendChild(
            dayFood
          );


          dayCard.addEventListener(
            "click",
            () => {

              openFoodPicker(
                dayFood,
                dateKey
              );

            }
          );


          weekElement.appendChild(
            dayCard
          );

        }


        menuWeeks.appendChild(
          weekElement
        );

      }

    }


    /* ÉTELVÁLASZTÓ */

    function openFoodPicker(
      dayFoodElement,
      dateKey
    ) {

      selectedDayFoodElement =
        dayFoodElement;

      selectedDateKey =
        dateKey;


      pickerDate.textContent =
        formatDateKey(
          dateKey
        );


      pickerSearch.value = "";


      if (
        savedMenu[
          selectedDateKey
        ]
      ) {

        removePlan.classList.remove(
          "hidden"
        );

      } else {

        removePlan.classList.add(
          "hidden"
        );

      }


      renderFoodPickerList();


      foodPicker.classList.remove(
        "hidden"
      );

    }


    function renderFoodPickerList() {

      foodPickerList.innerHTML = "";


      const searchText =
        normalizeText(
          pickerSearch.value
        ).trim();


      const filtered =
        availableFoods.filter(
          food =>
            foodMatchesSearch(
              food,
              searchText
            )
        );


      if (filtered.length === 0) {

        const empty =
          document.createElement("div");

        empty.className =
          "emptyMessage";

        empty.textContent =
          "Nincs találat. Felvehetsz új ételt is.";


        foodPickerList.appendChild(
          empty
        );

        return;

      }


      for (const food of filtered) {

        const item =
          document.createElement("div");

        item.className =
          "foodPickerItem";


        const name =
          document.createElement("div");

        name.className =
          "foodPickerItemName";

        name.textContent =
          food.name;


        item.appendChild(
          name
        );


        const meta =
          document.createElement("div");

        meta.className =
          "foodPickerItemMeta";


        const metaParts = [];


        const applicability =
          parseMultiValue(
            food.applicability
          );


        if (
          applicability.length > 0
        ) {

          metaParts.push(
            applicability.join(", ")
          );

        }


        const lastDate =
          getLastEatenDate(
            food.id
          );


        if (lastDate) {

          metaParts.push(
            "utoljára " +
            formatDateKey(lastDate)
          );

        }


        meta.textContent =
          metaParts.join(" • ");


        if (meta.textContent) {

          item.appendChild(
            meta
          );

        }


        item.addEventListener(
          "click",
          async () => {

            await saveMenuSelection(
              food
            );

          }
        );


        foodPickerList.appendChild(
          item
        );

      }

    }


    async function saveMenuSelection(
      food
    ) {

      const user =
        auth.currentUser;


      if (
        !user ||
        !selectedDateKey
      ) {

        return;

      }


      await setDoc(
        doc(
          db,
          "menu",
          selectedDateKey
        ),
        {
          date:
            selectedDateKey,

          foodId:
            food.id,

          foodName:
            food.name || "",

          updatedAt:
            serverTimestamp(),

          updatedBy:
            user.uid
        },
        {
          merge: true
        }
      );


      savedMenu[
        selectedDateKey
      ] = {
        date:
          selectedDateKey,

        foodId:
          food.id,

        foodName:
          food.name || ""
      };


      if (
        selectedDayFoodElement
      ) {

        selectedDayFoodElement.textContent =
          food.name;

        selectedDayFoodElement.classList.add(
          "planned"
        );

      }


      foodPicker.classList.add(
        "hidden"
      );


      renderFoodList();

    }


    pickerSearch.addEventListener(
      "input",
      renderFoodPickerList
    );


    closeFoodPicker.addEventListener(
      "click",
      () => {

        foodPicker.classList.add(
          "hidden"
        );

      }
    );


    removePlan.addEventListener(
      "click",
      async () => {

        if (!selectedDateKey) {
          return;
        }


        await deleteDoc(
          doc(
            db,
            "menu",
            selectedDateKey
          )
        );


        delete savedMenu[
          selectedDateKey
        ];


        if (
          selectedDayFoodElement
        ) {

          selectedDayFoodElement.textContent =
            "Nincs tervezve";

          selectedDayFoodElement.classList.remove(
            "planned"
          );

        }


        foodPicker.classList.add(
          "hidden"
        );


        renderFoodList();

      }
    );


    /* ÚJ ÉTEL / SZERKESZTÉS */

    function renderChoiceButtons(
      container,
      values,
      selectedValues,
      onChange
    ) {

      container.innerHTML = "";


      for (const value of values) {

        const button =
          document.createElement(
            "button"
          );

        button.type =
          "button";

        button.className =
          "choiceButton";

        button.textContent =
          value;


        if (
          selectedValues.includes(
            value
          )
        ) {

          button.classList.add(
            "selected"
          );

        }


        button.addEventListener(
          "click",
          () => {

            const index =
              selectedValues.indexOf(
                value
              );


            if (index >= 0) {

              selectedValues.splice(
                index,
                1
              );

            } else {

              selectedValues.push(
                value
              );

            }


            onChange();

          }
        );


        container.appendChild(
          button
        );

      }

    }


    function renderFormChoices() {

      renderChoiceButtons(
        typeChoices,
        collectTypeOptions(),
        selectedTypes,
        renderFormChoices
      );


      renderChoiceButtons(
        applicabilityChoices,
        collectApplicabilityOptions(),
        selectedApplicabilities,
        renderFormChoices
      );


      renderChoiceButtons(
        tagChoices,
        collectTagOptions(),
        selectedTags,
        renderFormChoices
      );

    }


    function openFoodForm(
      food,
      openedFromPicker
    ) {

      editingFoodId =
        food
          ? food.id
          : null;


      formOpenedFromPicker =
        openedFromPicker === true;


      foodFormMessage.classList.add(
        "hidden"
      );


      newTypeInput.value = "";

      newApplicabilityInput.value = "";

      newTagInput.value = "";


      if (food) {

        foodFormTitle.textContent =
          "Étel szerkesztése";


        foodNameInput.value =
          food.name || "";


        ingredientsInput.value =
          food.ingredients || "";


        selectedTypes =
          parseMultiValue(
            food.types
          );


        selectedApplicabilities =
          parseMultiValue(
            food.applicability
          );


        selectedTags =
          parseMultiValue(
            food.tags
          );


        editFoodFooter.classList.remove(
          "hidden"
        );


        if (food.active === false) {

          toggleActiveButton.textContent =
            "✓ Étel újraaktiválása";

        } else {

          toggleActiveButton.textContent =
            "Étel inaktiválása";

        }

      } else {

        foodFormTitle.textContent =
          "Új étel";


        foodNameInput.value = "";

        ingredientsInput.value = "";


        selectedTypes =
          ["Főétel"];


        selectedApplicabilities =
          [];


        selectedTags =
          [];


        editFoodFooter.classList.add(
          "hidden"
        );

      }


      renderFormChoices();


      foodFormModal.classList.remove(
        "hidden"
      );


      setTimeout(
        () => {

          foodNameInput.focus();

        },
        100
      );

    }


    function closeFoodFormModal() {

      foodFormModal.classList.add(
        "hidden"
      );

    }


    function addCustomValue(
      input,
      selectedArray
    ) {

      const value =
        input.value.trim();


      if (!value) {
        return;
      }


      if (
        !selectedArray.includes(
          value
        )
      ) {

        selectedArray.push(
          value
        );

      }


      input.value = "";


      renderFormChoices();

    }


    addTypeButton.addEventListener(
      "click",
      () => {

        addCustomValue(
          newTypeInput,
          selectedTypes
        );

      }
    );


    addApplicabilityButton.addEventListener(
      "click",
      () => {

        addCustomValue(
          newApplicabilityInput,
          selectedApplicabilities
        );

      }
    );


    addTagButton.addEventListener(
      "click",
      () => {

        addCustomValue(
          newTagInput,
          selectedTags
        );

      }
    );


    addFoodButton.addEventListener(
      "click",
      () => {

        openFoodForm(
          null,
          false
        );

      }
    );


    addFoodFromPicker.addEventListener(
      "click",
      () => {

        foodPicker.classList.add(
          "hidden"
        );


        openFoodForm(
          null,
          true
        );

      }
    );


    closeFoodForm.addEventListener(
      "click",
      closeFoodFormModal
    );


    cancelFoodButton.addEventListener(
      "click",
      closeFoodFormModal
    );


    saveFoodButton.addEventListener(
      "click",
      async () => {

        const user =
          auth.currentUser;


        if (!user) {
          return;
        }


        const name =
          foodNameInput.value.trim();


        if (!name) {

          foodFormMessage.textContent =
            "Az étel nevét add meg.";

          foodFormMessage.classList.remove(
            "hidden"
          );

          return;

        }


        saveFoodButton.disabled =
          true;

        saveFoodButton.textContent =
          "Mentés...";


        try {

          const foodData = {
            name:
              name,

            types:
              uniqueSorted(
                selectedTypes
              ),

            applicability:
              uniqueSorted(
                selectedApplicabilities
              ).join("; "),

            ingredients:
              ingredientsInput.value.trim(),

            tags:
              uniqueSorted(
                selectedTags
              ),

            active:
              true,

            updatedAt:
              serverTimestamp(),

            updatedBy:
              user.uid
          };


          let savedFood = null;


          if (editingFoodId) {

            const oldFood =
              allFoods.find(
                item =>
                  item.id ===
                  editingFoodId
              );


            if (
              oldFood &&
              oldFood.active === false
            ) {

              foodData.active =
                false;

            }


            await updateDoc(
              doc(
                db,
                "foods",
                editingFoodId
              ),
              foodData
            );


            savedFood = {
              id:
                editingFoodId,

              ...foodData
            };

          } else {

            foodData.createdAt =
              serverTimestamp();

            foodData.createdBy =
              user.uid;


            const newDocument =
              await addDoc(
                collection(
                  db,
                  "foods"
                ),
                foodData
              );


            savedFood = {
              id:
                newDocument.id,

              ...foodData
            };

          }


          await loadFoods();


          closeFoodFormModal();


          /*
            Ha a menüből indítottuk az
            új étel felvételét, az új
            ételt rögtön beállítjuk az
            adott napra.
          */

          if (
            formOpenedFromPicker &&
            !editingFoodId &&
            selectedDateKey
          ) {

            const currentFood =
              allFoods.find(
                item =>
                  item.id ===
                  savedFood.id
              );


            if (currentFood) {

              await saveMenuSelection(
                currentFood
              );

            }

          }


        } catch (error) {

          console.error(error);


          foodFormMessage.textContent =
            "A mentés nem sikerült: " +
            error.message;


          foodFormMessage.classList.remove(
            "hidden"
          );


        } finally {

          saveFoodButton.disabled =
            false;

          saveFoodButton.textContent =
            "Mentés";

        }

      }
    );


    toggleActiveButton.addEventListener(
      "click",
      async () => {

        if (!editingFoodId) {
          return;
        }


        const food =
          allFoods.find(
            item =>
              item.id ===
              editingFoodId
          );


        if (!food) {
          return;
        }


        const newActiveValue =
          food.active === false;


        await updateDoc(
          doc(
            db,
            "foods",
            editingFoodId
          ),
          {
            active:
              newActiveValue,

            updatedAt:
              serverTimestamp(),

            updatedBy:
              auth.currentUser
                ? auth.currentUser.uid
                : ""
          }
        );


        await loadFoods();


        closeFoodFormModal();


        renderFoodPickerList();

      }
    );


    /* NAVIGÁCIÓ */

    function showMenu() {

      menuView.classList.remove(
        "hidden"
      );

      foodsView.classList.add(
        "hidden"
      );


      menuNavButton.classList.add(
        "active"
      );

      foodsNavButton.classList.remove(
        "active"
      );

    }


    function showFoods() {

      menuView.classList.add(
        "hidden"
      );

      foodsView.classList.remove(
        "hidden"
      );


      menuNavButton.classList.remove(
        "active"
      );

      foodsNavButton.classList.add(
        "active"
      );


      renderFoodList();

    }


    menuNavButton.addEventListener(
      "click",
      showMenu
    );


    foodsNavButton.addEventListener(
      "click",
      showFoods
    );


    /* LOGIN */

    loginButton.addEventListener(
      "click",
      async () => {

        try {

          await signInWithPopup(
            auth,
            provider
          );

        } catch (error) {

          console.error(error);


          status.textContent =
            "A bejelentkezés nem sikerült: " +
            error.message;

        }

      }
    );


    logoutButton.addEventListener(
      "click",
      async () => {

        await signOut(auth);

      }
    );


    onAuthStateChanged(
      auth,
      async user => {

        if (user) {

          loginView.classList.add(
            "hidden"
          );

          appView.classList.remove(
            "hidden"
          );


          userName.textContent =
            user.displayName ||
            user.email ||
            "Felhasználó";


          try {

            await loadSavedMenu();

            await loadFoods();

            createMenu();

            showMenu();

          } catch (error) {

            console.error(error);

          }


        } else {

          appView.classList.add(
            "hidden"
          );

          loginView.classList.remove(
            "hidden"
          );


          status.textContent =
            "A menütervező használatához jelentkezz be.";


          loginButton.classList.remove(
            "hidden"
          );

        }

      }
    );

  </script>
