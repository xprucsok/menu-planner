name: Download school menus

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

jobs:
  download-menus:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current and next 3 weeks
        shell: bash
        run: |
          mkdir -p school-pdfs

          for OFFSET in 0 7 14 21
          do
            WEEK=$(date -u -d "+${OFFSET} days" +%V)
            WEEK=$((10#$WEEK))

            FILE="school-pdfs/ka${WEEK}.pdf"
            URL="https://bakosestarsai.hu/media/files/etlapok/ka${WEEK}.pdf"

            echo "Checking ISO week: $WEEK"

            if [ -f "$FILE" ]; then
              echo "ka${WEEK}.pdf already exists - skipping."
              continue
            fi

            echo "Trying: $URL"

            if curl --fail --location --silent --show-error \
              --retry 2 \
              --output "${FILE}.tmp" \
              "$URL"
            then
              if file "${FILE}.tmp" | grep -qi "PDF"; then
                mv "${FILE}.tmp" "$FILE"
                echo "Downloaded ka${WEEK}.pdf successfully."
              else
                echo "Response was not a PDF - ignoring."
                rm -f "${FILE}.tmp"
              fi
            else
              echo "ka${WEEK}.pdf is not available yet."
              rm -f "${FILE}.tmp"
            fi
          done

      - name: Commit new menus
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add school-pdfs/

          if git diff --cached --quiet; then
            echo "No new school menus."
          else
            git commit -m "Add new school menu PDF"
            git push
          fi
