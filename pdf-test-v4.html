<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakos PDF parser teszt V4</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #222; }
    main { max-width: 1050px; margin: auto; padding: 20px; }
    .box { background: white; border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    h1 { font-size: 24px; margin-top: 0; }
    h2 { font-size: 20px; }
    h3 { margin: 0 0 8px; }
    input, button { font: inherit; }
    input[type=file] { width: 100%; margin: 10px 0; }
    button { border: 0; border-radius: 10px; padding: 11px 15px; background: #222; color: white; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .status { margin-top: 10px; font-weight: 600; }
    .week { margin-top: 18px; }
    .days { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .day { background: #fafafa; border: 1px solid #ddd; border-radius: 12px; padding: 12px; min-width: 0; }
    .meal { margin-top: 12px; padding-top: 10px; border-top: 1px solid #ddd; }
    .meal-title { font-weight: 700; margin-bottom: 5px; }
    .line { margin: 3px 0; overflow-wrap: anywhere; }
    .nutrition { font-size: 12px; color: #666; margin-top: 7px; line-height: 1.35; }
    .meta { color: #666; margin-bottom: 12px; }
    .warn { color: #8a4b00; }
    pre { white-space: pre-wrap; word-break: break-word; background: #111; color: #eee; padding: 12px; border-radius: 10px; max-height: 420px; overflow: auto; }
    @media (max-width: 800px) { .days { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <section class="box">
    <h1>Bakos étlap PDF parser - V4 teszt</h1>
    <p>V4: vizuális sorrekonstrukció a cellán belül, majd étel/allergén/összetevő értelmezés. A fájlok csak a böngésződben kerülnek feldolgozásra.</p>
    <input id="files" type="file" accept="application/pdf" multiple>
    <button id="run">Feldolgozás</button>
    <div id="status" class="status"></div>
  </section>
  <div id="results"></div>
</main>
<script type="module">
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

const DAYS = ["Hétfő", "Kedd", "Szerda", "Csütörtök", "Péntek"];
const MEALS = ["Tízórai", "Ebéd", "Uzsonna"];

function esc(value) {
  return String(value == null ? "" : value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function normalize(s) {
  return String(s || "").replace(/\s+/g, " ").trim();
}

function groupLines(items, tolerance) {
  const sorted = items.slice().sort(function(a, b) {
    if (Math.abs(a.top - b.top) > tolerance) return a.top - b.top;
    return a.x - b.x;
  });
  const lines = [];
  sorted.forEach(function(item) {
    let target = null;
    for (let i = lines.length - 1; i >= 0; i--) {
      if (Math.abs(lines[i].top - item.top) <= tolerance) { target = lines[i]; break; }
      if (lines[i].top < item.top - tolerance) break;
    }
    if (!target) {
      target = { top: item.top, items: [] };
      lines.push(target);
    }
    target.items.push(item);
    target.top = target.items.reduce(function(sum, x) { return sum + x.top; }, 0) / target.items.length;
  });
  lines.sort(function(a, b) { return a.top - b.top; });
  return lines.map(function(line) {
    line.items.sort(function(a, b) { return a.x - b.x; });
    return {
      top: line.top,
      text: normalize(line.items.map(function(x) { return x.text; }).join(" ")),
      x: Math.min.apply(null, line.items.map(function(x) { return x.x; })),
      right: Math.max.apply(null, line.items.map(function(x) { return x.right; }))
    };
  });
}

function getColumnCenters(items) {
  const centers = [];
  DAYS.forEach(function(day) {
    const found = items.find(function(x) { return normalize(x.text) === day; });
    centers.push(found ? (found.x + found.right) / 2 : null);
  });
  return centers;
}

function getColumnBounds(centers, pageWidth) {
  if (centers.some(function(x) { return x == null; })) {
    const left = pageWidth * 0.0865;
    const right = pageWidth * 0.9915;
    const step = (right - left) / 5;
    return [left, left + step, left + step * 2, left + step * 3, left + step * 4, right];
  }
  const bounds = [];
  const gap = centers[1] - centers[0];
  bounds.push(centers[0] - gap / 2);
  for (let i = 0; i < 4; i++) bounds.push((centers[i] + centers[i + 1]) / 2);
  bounds.push(centers[4] + gap / 2);
  return bounds;
}

function findEnergyRows(items) {
  const ys = items.filter(function(x) {
    return normalize(x.text).toLowerCase() === "energia:";
  }).map(function(x) { return x.top; }).sort(function(a,b) { return a-b; });
  const unique = [];
  ys.forEach(function(y) {
    if (!unique.length || Math.abs(unique[unique.length - 1] - y) > 3) unique.push(y);
  });
  return unique.slice(0, 3);
}

function normalizePdfText(s) {
  return normalize(String(s || "")
    .replace(/[‐‑‒–—]/g, "-")
    .replace(/\s*\*\s*/g, " *")
    .replace(/\s*,\s*/g, ","));
}

function isAllergenOnly(text) {
  return /^\*\s*\d+(?:,\d+)*\s*$/.test(normalizePdfText(text));
}

function extractAllergens(text) {
  const matches = normalizePdfText(text).match(/\*\s*(\d+(?:,\d+)*)/g) || [];
  const nums = [];
  matches.forEach(function(m) {
    const inner = m.replace(/^\*\s*/, "").split(",");
    inner.forEach(function(x) {
      const n = Number(x.trim());
      if (Number.isFinite(n) && !nums.includes(n)) nums.push(n);
    });
  });
  return nums;
}

function stripAllergens(text) {
  return normalizePdfText(text).replace(/\s*\*\s*\d+(?:,\d+)*/g, "").trim();
}

function mergeAllergens(target, values) {
  values.forEach(function(n) {
    if (!target.includes(n)) target.push(n);
  });
}

function reconstructVisualRows(lines) {
  const rows = lines.map(function(line) {
    return {
      text: normalizePdfText(line.text),
      top: line.top,
      x: line.x,
      right: line.right
    };
  }).filter(function(row) { return row.text; });

  const out = [];
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const prev = out.length ? out[out.length - 1] : null;

    // Külön fizikai sorba került allergén mindig az előző vizuális sor része.
    if (prev && isAllergenOnly(row.text)) {
      prev.text = normalizePdfText(prev.text + " " + row.text);
      prev.bottom = row.top;
      continue;
    }

    // PDF sortörés szó közepén: "1,5%-" + "os *7".
    if (prev && /-$/.test(prev.text) && /^[a-záéíóöőúüű]/i.test(row.text)) {
      prev.text = normalizePdfText(prev.text.slice(0, -1) + "-" + row.text);
      prev.bottom = row.top;
      continue;
    }

    out.push({ text: row.text, top: row.top, bottom: row.top, x: row.x, right: row.right });
  }
  return out;
}

function isDescriptionStart(text) {
  return /^\s*\(/.test(text);
}

function parenBalance(text) {
  return (String(text).match(/\(/g) || []).length - (String(text).match(/\)/g) || []).length;
}

function shouldContinueFoodName(prev, current, gap) {
  if (!prev || !current) return false;
  if (isAllergenOnly(current)) return true;
  if (isDescriptionStart(current)) return false;

  const prevName = stripAllergens(prev);
  const curName = stripAllergens(current);
  if (!curName) return true;

  // Egy PDF-sorba nem férő ételnév tipikus folytatásai.
  if (/[,\-]$/.test(prevName)) return true;
  if (/^[a-záéíóöőúüű]/.test(curName)) return true;

  // Szűk sortávolság + az előző sorban még nincs allergén: valószínűleg ugyanaz a hosszú ételnév.
  // Az új fogások a Bakos sablonban jellemzően nagyobb függőleges elválasztást kapnak vagy allergénnel zárulnak.
  if (gap <= 11 && extractAllergens(prev).length === 0) {
    const continuationWords = /^(sertéscombbal|tojással|és\b|kukoricás\b|sajtmártásban\b|durum\b|tésztával\b|csirkemell\b|sertéskaraj\b|húsgombóc\b|töltelékes\b|napraforgómaggal\b)/i;
    if (continuationWords.test(curName)) return true;
  }
  return false;
}

function cleanFoodLines(lines) {
  const rows = reconstructVisualRows(lines);
  const foods = [];
  let descriptionFood = null;
  let descriptionBalance = 0;

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const text = normalizePdfText(row.text);
    if (!text) continue;

    if (descriptionFood) {
      descriptionFood.description = normalize((descriptionFood.description || "") + " " + text);
      descriptionBalance += parenBalance(text);
      if (descriptionBalance <= 0) {
        descriptionFood = null;
        descriptionBalance = 0;
      }
      continue;
    }

    if (isDescriptionStart(text) && foods.length) {
      const food = foods[foods.length - 1];
      food.description = normalize((food.description || "") + " " + text);
      descriptionBalance = parenBalance(text);
      if (descriptionBalance > 0) descriptionFood = food;
      continue;
    }

    if (isAllergenOnly(text) && foods.length) {
      mergeAllergens(foods[foods.length - 1].allergens, extractAllergens(text));
      continue;
    }

    const previousRow = i > 0 ? rows[i - 1] : null;
    const gap = previousRow ? row.top - previousRow.top : 99;
    const prevFood = foods.length ? foods[foods.length - 1] : null;

    if (prevFood && shouldContinueFoodName(prevFood.rawText, text, gap)) {
      const addName = stripAllergens(text);
      if (addName) prevFood.name = normalize(prevFood.name + " " + addName);
      prevFood.rawText = normalizePdfText(prevFood.rawText + " " + text);
      mergeAllergens(prevFood.allergens, extractAllergens(text));
      continue;
    }

    const name = stripAllergens(text);
    const allergens = extractAllergens(text);
    if (!name) {
      if (foods.length) mergeAllergens(foods[foods.length - 1].allergens, allergens);
      continue;
    }

    foods.push({
      name: name,
      allergens: allergens,
      description: "",
      rawText: text
    });
  }

  return foods.map(function(food) {
    let description = normalize(food.description || "");
    description = description.replace(/^\(/, "").replace(/\)$/, "").trim();
    return {
      name: normalize(food.name),
      allergens: food.allergens,
      description: description
    };
  }).filter(function(food) { return food.name; });
}

function foodsForCell(items, left, right, top, bottom) {
  const cellItems = items.filter(function(x) {
    const centerX = (x.x + x.right) / 2;
    return centerX >= left && centerX < right && x.top >= top && x.top < bottom;
  });
  const lines = groupLines(cellItems, 2.2).filter(function(x) { return x.text; });
  return cleanFoodLines(lines);
}

function toNumber(value) {
  if (value == null) return null;
  const n = Number(String(value).replace(",", "."));
  return Number.isFinite(n) ? n : null;
}

function parseNutritionText(text) {
  const normalized = normalize(text).replace(/Kcal/g, "kcal").replace(/gr\b/g, "g");
  const values = normalized.match(/\d+(?:[\.,]\d+)?\s*(?:kcal|g)/gi) || [];
  const nums = values.map(function(v) {
    const m = v.match(/\d+(?:[\.,]\d+)?/);
    return m ? toNumber(m[0]) : null;
  });
  return {
    energyKcal: nums.length > 0 ? nums[0] : null,
    proteinG: nums.length > 1 ? nums[1] : null,
    fatG: nums.length > 2 ? nums[2] : null,
    saturatedFatG: nums.length > 3 ? nums[3] : null,
    carbsG: nums.length > 4 ? nums[4] : null,
    sugarG: nums.length > 5 ? nums[5] : null,
    saltG: nums.length > 6 ? nums[6] : null,
    raw: text
  };
}

function nutritionForCell(items, left, right, energyY, nextTop) {
  const arr = items.filter(function(x) {
    const centerX = (x.x + x.right) / 2;
    return centerX >= left && centerX < right && x.top >= energyY - 2 && x.top < nextTop;
  });
  const raw = groupLines(arr, 1.8).map(function(x) { return x.text; }).filter(Boolean).join(" | ");
  return parseNutritionText(raw);
}

function parseHeader(lines) {
  const all = lines.map(function(x) { return x.text; }).join(" ");
  let week = "?";
  let range = "";
  const wm = all.match(/(\d{1,2})\.?\s*h[eé]t/i);
  if (wm) week = wm[1];
  const dm = all.match(/2026[\.\-]\s*\d{1,2}[\.\-]\s*\d{1,2}\.?\s*[-–]\s*(?:2026[\.\-]\s*)?\d{1,2}[\.\-]\s*\d{1,2}\.?/);
  if (dm) range = dm[0];
  return { week: week, range: range };
}

async function parsePdf(file) {
  const data = new Uint8Array(await file.arrayBuffer());
  const pdf = await pdfjsLib.getDocument({ data: data }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 1 });
  const tc = await page.getTextContent();
  const items = tc.items.filter(function(it) { return normalize(it.str); }).map(function(it) {
    const x = it.transform[4];
    const y = it.transform[5];
    const h = Math.abs(it.height || it.transform[3] || 0);
    const top = viewport.height - y - h;
    return { text: it.str, x: x, right: x + (it.width || 0), top: top, height: h };
  });
  const allLines = groupLines(items, 2.2);
  const header = parseHeader(allLines.filter(function(x) { return x.top < 90; }));
  const centers = getColumnCenters(items);
  const bounds = getColumnBounds(centers, viewport.width);
  const energy = findEnergyRows(items);
  if (energy.length !== 3) throw new Error("Nem találtam meg a három tápérték-sort. Talált sorok: " + energy.length);

  const weekdayY = items.filter(function(x) { return DAYS.includes(normalize(x.text)); }).map(function(x) { return x.top; });
  const dayHeaderTop = weekdayY.length ? Math.min.apply(null, weekdayY) : energy[0] - 90;
  const breakfastTop = dayHeaderTop + 8;
  const lunchTop = energy[0] + 36;
  const snackTop = energy[1] + 36;
  const mealRanges = [
    { foodTop: breakfastTop, foodBottom: energy[0] - 1, nutritionTop: energy[0], nutritionBottom: lunchTop - 2 },
    { foodTop: lunchTop, foodBottom: energy[1] - 1, nutritionTop: energy[1], nutritionBottom: snackTop - 2 },
    { foodTop: snackTop, foodBottom: energy[2] - 1, nutritionTop: energy[2], nutritionBottom: energy[2] + 36 }
  ];

  const days = [];
  for (let d = 0; d < 5; d++) {
    const day = { name: DAYS[d], meals: [] };
    for (let m = 0; m < 3; m++) {
      day.meals.push({
        name: MEALS[m],
        foods: foodsForCell(items, bounds[d], bounds[d + 1], mealRanges[m].foodTop, mealRanges[m].foodBottom),
        nutrition: nutritionForCell(items, bounds[d], bounds[d + 1], mealRanges[m].nutritionTop, mealRanges[m].nutritionBottom)
      });
    }
    days.push(day);
  }
  return { fileName: file.name, week: header.week, range: header.range, days: days, diagnostics: { pageWidth: viewport.width, pageHeight: viewport.height, energyRows: energy, columnBounds: bounds } };
}


function renderNutrition(n) {
  if (!n) return "";
  const parts = [];
  if (n.energyKcal != null) parts.push("energia: " + esc(n.energyKcal) + " kcal");
  if (n.proteinG != null) parts.push("fehérje: " + esc(n.proteinG) + " g");
  if (n.fatG != null) parts.push("zsír: " + esc(n.fatG) + " g");
  if (n.saturatedFatG != null) parts.push("telített: " + esc(n.saturatedFatG) + " g");
  if (n.carbsG != null) parts.push("szénhidrát: " + esc(n.carbsG) + " g");
  if (n.sugarG != null) parts.push("cukor: " + esc(n.sugarG) + " g");
  if (n.saltG != null) parts.push("só: " + esc(n.saltG) + " g");
  if (!parts.length) return esc(n.raw || "");
  return parts.join(" · ");
}

function render(result) {
  let html = '<section class="box week">';
  html += '<h2>' + esc(result.fileName) + ' - ' + esc(result.week) + '. hét</h2>';
  html += '<div class="meta">' + esc(result.range || "Dátumtartomány nem felismerve") + '</div>';
  html += '<div class="days">';
  result.days.forEach(function(day) {
    html += '<article class="day"><h3>' + esc(day.name) + '</h3>';
    day.meals.forEach(function(meal) {
      html += '<div class="meal"><div class="meal-title">' + esc(meal.name) + '</div>';
      if (meal.foods.length) {
        meal.foods.forEach(function(food) {
          let label = food.name;
          if (food.allergens && food.allergens.length) label += " *" + food.allergens.join(",");
          html += '<div class="line">• ' + esc(label) + '</div>';
          if (food.description) html += '<div class="nutrition">összetevők: ' + esc(food.description.replace(/^\(|\)$/g, "")) + '</div>';
        });
      } else {
        html += '<div class="line warn">Nincs felismert étel</div>';
      }
      html += '<div class="nutrition">' + renderNutrition(meal.nutrition) + '</div></div>';
    });
    html += '</article>';
  });
  html += '</div>';
  html += '<details><summary>Diagnosztika / JSON</summary><pre>' + esc(JSON.stringify(result, null, 2)) + '</pre></details>';
  html += '</section>';
  return html;
}

document.getElementById("run").addEventListener("click", async function() {
  const files = Array.from(document.getElementById("files").files || []);
  if (!files.length) { document.getElementById("status").textContent = "Előbb válassz ki legalább egy PDF-et."; return; }
  const button = document.getElementById("run");
  button.disabled = true;
  document.getElementById("results").innerHTML = "";
  document.getElementById("status").textContent = "Feldolgozás...";
  let ok = 0;
  for (const file of files) {
    try {
      const result = await parsePdf(file);
      document.getElementById("results").insertAdjacentHTML("beforeend", render(result));
      ok++;
    } catch (err) {
      document.getElementById("results").insertAdjacentHTML("beforeend", '<section class="box"><h2>' + esc(file.name) + '</h2><div class="warn">Hiba: ' + esc(err.message) + '</div></section>');
    }
  }
  document.getElementById("status").textContent = ok + " / " + files.length + " PDF feldolgozva.";
  button.disabled = false;
});
</script>
</body>
</html>
